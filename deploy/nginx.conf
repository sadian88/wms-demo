# Configuración de nginx para la aplicación (SPA con rutas del lado del cliente).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Archivos compilados con hash en el nombre: se pueden guardar un año
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Estado y versión desplegada
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version.txt {
    default_type text/plain;
    expires -1;
  }

  # El HTML nunca se guarda en caché: así cada despliegue se ve de inmediato
  location = /index.html {
    expires -1;
  }

  # Cualquier otra ruta (/wms/4-2, /sign-in…) la resuelve la aplicación
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
